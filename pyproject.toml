[project]
name = "chat-jev"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.7.0",
    "httpx>=0.28.1",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
]

[project.scripts]
chat-jev = "chat_jev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chat_jev"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
